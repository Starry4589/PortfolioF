<path d="M200 240V288" fill="none" stroke="#fff0ff" stroke-width="2.4" />
<g fill="#ffe7a1" stroke="#d18a5d" stroke-width="1"><use href="#star" transform="translate(183 258) scale(.42)" /><use href="#star" transform="translate(218 270) scale(.42)" /></g>
<path d="M169 286Q200 300 231 286L233 301Q200 316 167 301Z" fill="#ff72b6" stroke="#b35c91" stroke-width="2.2" stroke-linejoin="round" />

<!-- skirt -->
