 <path d="M240 206Q264 220 268 250L291 220" stroke="#b35c91" stroke-width="20" />
 <path d="M240 206Q264 220 268 250L291 220" stroke="#ffe3da" stroke-width="10" />
</g>
<!-- open hand -->
<g transform="translate(294 212) rotate(25)" stroke-linecap="round" fill="none">
 <g stroke="#b35c91" stroke-width="7.5"><path d="M-6 -6L-9 -20M-2 -8L-2 -25M3 -8L5 -24M7 -5L12 -18M8 3L18 -3" /></g>
 <ellipse rx="10.5" ry="9" fill="#b35c91" stroke="#b35c91" stroke-width="2" />
 <g stroke="#ffe3da" stroke-width="4.5"><path d="M-6 -6L-9 -20M-2 -8L-2 -25M3 -8L5 -24M7 -5L12 -18M8 3L18 -3" /></g>
 <ellipse rx="9.3" ry="8.3" fill="#ffe3da" stroke="none" />
 <path d="M-4 -14L-5 -10M1 -16L1 -11M5 -15L6 -10" stroke="#e6b0a8" stroke-width="1" opacity=".7" />
</g>

<!-- LEFT ARM: holding mic -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M160 206Q142 226 147 252L168 224" stroke="#b35c91" stroke-width="20" />
 <path d="M160 206Q142 226 147 252L168 224" stroke="#ffe3da" stroke-width="10" />
</g>
<g transform="translate(172 219) rotate(18)">
 <g stroke="#66516e" stroke-width="1.8" stroke-linejoin="round">
  <rect x="-5" y="-8" width="10" height="46" rx="5" fill="url(#boot)" />
  <ellipse cx="0" cy="-20" rx="9.5" ry="12" fill="#d8c8e9" />
  <path d="M-9 -24H9M-9.5 -19H9.5M-8.5 -14H8.5" stroke="#8f78a5" fill="none" />
  <path d="M-4 32H4" stroke="#ff73b5" stroke-width="3" />
 </g>
 <!-- fist -->
 <rect x="-10" y="-7" width="20" height="16" rx="6" fill="#ffe3da" stroke="#b35c91" stroke-width="1.8" />
 <path d="M-8 -2Q0 -0.5 8 -2M-8 3Q0 4.5 8 3" fill="none" stroke="#d89a9a" stroke-width="1.3" stroke-linecap="round" />
 <ellipse cx="3" cy="-8" rx="5" ry="3.5" fill="#ffe3da" stroke="#b35c91" stroke-width="1.6" />
</g>

<!-- shoulder puffs -->
<g fill="#fff3fb" stroke="#b35c91" stroke-width="2"><ellipse cx="160" cy="204" rx="13" ry="10" /><ellipse cx="240" cy="204" rx="13" ry="10" /></g>

<!-- HEAD BLOCK -->
<g transform="translate(200 28) scale(.62) translate(-200 -53)">
 <!-- Head Base & Ears -->
 <g fill="url(#skin)" stroke="#b35c91" stroke-width="2.5">
   <ellipse cx="139" cy="190" rx="11" ry="17" />
   <ellipse cx="261" cy="190" rx="11" ry="17" />
   <path d="M139 151Q139 101 200 100Q261 101 261 151L255 211Q249 240 214 262Q200 270 186 262Q151 240 145 211Z" />
 </g>

 <!-- SOFT EYEBROWS -->
 <path d="M153 162 Q170 152 187 163" fill="none" stroke="#803565" stroke-width="3" stroke-linecap="round" />
 <path d="M213 163 Q230 152 247 162" fill="none" stroke="#803565" stroke-width="3" stroke-linecap="round" />

 <!-- SPARKLE IDOL EYES STYLE -->
 <g id="sparkle-eyes">
   <!-- Sclera -->
   <ellipse cx="170" cy="190" rx="15" ry="19" fill="#ffffff" />
   <ellipse cx="230" cy="190" rx="15" ry="19" fill="#ffffff" />

   <!-- Thick Upper Lash Line -->
   <path d="M152 181 Q170 167 188 181" fill="none" stroke="#3d1446" stroke-width="3" stroke-linecap="round" />
   <path d="M212 181 Q230 167 248 181" fill="none" stroke="#3d1446" stroke-width="3" stroke-linecap="round" />

   <!-- Soft Bottom Lash Accents -->
   <path d="M162 205 Q170 208 178 205" fill="none" stroke="#b35c91" stroke-width="2" opacity=".6" stroke-linecap="round" />
   <path d="M222 205 Q230 208 238 205" fill="none" stroke="#b35c91" stroke-width="2" opacity=".6" stroke-linecap="round" />

   <!-- Irises -->
   <ellipse cx="170" cy="191" rx="11.5" ry="15.5" fill="url(#eye)" />
   <ellipse cx="230" cy="191" rx="11.5" ry="15.5" fill="url(#eye)" />

   <!-- Pupils -->
   <ellipse cx="170" cy="194" rx="5" ry="7.5" fill="#200628" />
   <ellipse cx="230" cy="194" rx="5" ry="7.5" fill="#200628" />

   <!-- Star Sparkle Highlights -->
   <use href="#star" transform="translate(166 183) scale(.35)" />
   <use href="#star" transform="translate(226 183) scale(.35)" />

   <!-- Small Round Secondary Highlights -->
   <circle cx="175" cy="198" r="2.5" fill="#ffffff" />
   <circle cx="235" cy="198" r="2.5" fill="#ffffff" />
 </g>

 <!-- Blush -->
 <g fill="#ff8fb4" opacity=".65">
   <ellipse cx="148" cy="217" rx="12" ry="5" />
   <ellipse cx="252" cy="217" rx="12" ry="5" />
 </g>

 <!-- Nose & Mouth -->
 <path d="M198 208 Q200 210 202 208" stroke="#df8c98" stroke-width="1.5" fill="none" stroke-linecap="round" />
 <path d="M192 224Q200 220 208 224Q206 234 200 234Q194 234 192 224Z" fill="#a94072" />
 <path d="M195 224Q200 222 205 224" stroke="#fff" stroke-width="1.6" fill="none" />

 <!-- Hair Bangs -->
 <path d="M136 180Q119 120 165 83Q204 53 242 84Q278 111 265 181L253 199Q250 158 235 139Q221 165 209 170Q210 142 199 126Q184 157 165 169Q168 142 155 132Q143 153 145 191Z" fill="url(#hair)" stroke="#bd438b" stroke-width="3" stroke-linejoin="round" />
 <path d="M142 164Q132 202 147 232L158 208 157 166ZM258 164Q268 202 253 232L242 208 243 166Z" fill="url(#hair)" stroke="#bd438b" stroke-width="2.5" />
 <g fill="none" stroke="#fff0fb" stroke-width="4" stroke-linecap="round"><path d="M172 91Q199 75 222 91M230 96Q243 104 248 116M151 142l4 17" /></g>

 <!-- Hair Bows -->
 <g transform="translate(139 127) rotate(-18)"><use href="#bow" /></g>
 <g transform="translate(261 127) rotate(18)"><use href="#bow" /></g>
</g>

<!-- sparkles -->
<g opacity=".95"><use href="#star" transform="translate(78 150) scale(.8)" /><use href="#star" transform="translate(335 170) scale(.75)" /><use href="#star" transform="translate(95 430) scale(.55)" /><use href="#star" transform="translate(315 450) scale(.6)" /></g>
</svg>
