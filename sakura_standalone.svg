<path d="M136 366Q154 384 168 376Q184 392 200 380Q216 392 232 376Q246 384 264 366L270 378Q250 398 232 388Q216 404 200 392Q184 404 168 388Q150 398 130 378Z" fill="#fff5ff" stroke="#b35c91" stroke-width="2" stroke-linejoin="round" />
