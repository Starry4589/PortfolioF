<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" width="400" height="760">
<title>Sakura Hoshi</title>
<defs>
 <linearGradient id="hair" x2="1" y2="1"><stop stop-color="#ffd6f1" /><stop offset=".5" stop-color="#ff82bf" /><stop offset="1" stop-color="#cf4b96" /></linearGradient>
 <linearGradient id="skin" x2="0" y2="1"><stop stop-color="#fff4ed" /><stop offset="1" stop-color="#ffc9c9" /></linearGradient>
 <linearGradient id="dress" x2="1" y2="1"><stop stop-color="#fff7ff" /><stop offset=".5" stop-color="#ff9ed4" /><stop offset="1" stop-color="#b9a0ff" /></linearGradient>
 <radialGradient id="eye"><stop stop-color="#fff" /><stop offset=".3" stop-color="#f8a9ff" /><stop offset=".7" stop-color="#b044d7" /><stop offset="1" stop-color="#42154d" /></radialGradient>
 <linearGradient id="boot" x2="1" y2="1"><stop stop-color="#fff" /><stop offset="1" stop-color="#d4c2f0" /></linearGradient>
 <g id="star"><path d="M0-10 3-3 10 0 3 3 0 10-3 3-10 0-3-3Z" fill="#fff0a8" stroke="#e9a0d1" stroke-width="1.2" /></g>
 <g id="bow" stroke="#b74f91" stroke-width="2" stroke-linejoin="round"><path d="M0 0-24-16-22 8-5 13Z" fill="#fff0fb" /><path d="M0 0 24-16 22 8 5 13Z" fill="#ffc1e4" /><circle r="6" fill="#ffe7a1" /></g>
</defs>

<ellipse cx="200" cy="702" rx="88" ry="8" fill="#b9a0ff" opacity=".25" />

<!-- twin tails -->
